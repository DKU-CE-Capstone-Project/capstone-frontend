# 프론트엔드만 단독으로 띄워서 UI 를 확인할 때 쓴다.
# 전체 스택(백엔드·Mongo·NATS·Redis)은 capstone-deploy 저장소의 compose 를 쓸 것.
#
#   docker compose up --build        → http://localhost:8080
#
# 백엔드 없이도 컨테이너는 정상 기동하고 화면이 끝까지 동작한다.
# /api/* 요청은 502 가 되고, 프론트가 로컬 fallback 데이터로 대체해 그린다.
services:
  frontend:
    build:
      context: .
      args:
        # 빈 값 → 프론트가 동일 출처로 호출 → 아래 nginx 가 백엔드로 프록시
        VITE_API_BASE: ""
    image: econmind-frontend:dev
    ports:
      - "8080:80"
    environment:
      # 호스트에서 `uvicorn app.main:app --port 8000` 으로 백엔드를 돌리는 중이라면
      # 아래 주석을 풀어 호스트로 프록시한다.
      # BACKEND_ORIGIN: host.docker.internal:8000
      BACKEND_ORIGIN: econmind-api:8000
    extra_hosts:
      # Linux 에서 host.docker.internal 을 쓰려면 필요하다 (macOS/Windows 는 기본 제공)
      - "host.docker.internal:host-gateway"
    mem_limit: 128m
