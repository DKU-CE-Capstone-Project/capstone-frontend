# 정적 SPA 서빙 + 백엔드 API 프록시.
# 백엔드 서비스명은 docker-compose/k8s 모두 'econmind-api'로 통일.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 백엔드 프록시 ──────────────────────────────────────────────
    location /analyze {
        proxy_pass http://econmind-api:8000;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://econmind-api:8000;
        proxy_set_header Host $host;
    }
    location /jobs {
        proxy_pass http://econmind-api:8000;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://econmind-api:8000;
    }
}
