# 정적 SPA 서빙 + 백엔드 API 프록시.
# 백엔드 서비스명은 docker-compose/k8s 모두 'econmind-api'로 통일.
#
# proxy_pass 에 호스트명을 리터럴로 쓰면(`proxy_pass http://econmind-api:8000;`)
# nginx 가 "기동 시점"에 DNS 를 해석하고, 실패하면 아예 뜨지 않는다.
#
#   nginx: [emerg] host not found in upstream "econmind-api"
#
# 즉 백엔드 없이 프론트 컨테이너만 띄워 UI 를 보는 게 불가능했다.
# 변수($econmind_backend)를 거치면 해석이 "요청 시점"으로 미뤄져서,
# 백엔드가 없으면 그 요청만 502 가 되고 정적 페이지는 정상 서빙된다.
#
# $econmind_backend 와 resolver 는 docker-entrypoint.d/10-backend-resolver.sh 가
# 컨테이너 기동 시 /etc/nginx/conf.d/00-backend.conf 로 생성한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    proxy_read_timeout 1500s;
    proxy_send_timeout 1500s;

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 빌드 산출물은 불변이므로 길게 캐시한다.
    # expires 와 add_header 를 같이 쓰면 Cache-Control 이 두 줄로 나가므로 하나로 합친다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── 백엔드 프록시 ──────────────────────────────────────────────
    location /analyze {
        proxy_pass http://$econmind_backend;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://$econmind_backend;
        proxy_set_header Host $host;
    }
    location /jobs {
        proxy_pass http://$econmind_backend;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://$econmind_backend;
        proxy_set_header Host $host;
    }

    # 프론트 컨테이너 자체의 생존 확인용. /health 는 백엔드로 프록시되므로
    # 백엔드가 죽으면 502 가 되어 프론트 헬스체크로는 쓸 수 없다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    location /ready {
        proxy_pass http://$econmind_backend;
        proxy_set_header Host $host;
    }
}
